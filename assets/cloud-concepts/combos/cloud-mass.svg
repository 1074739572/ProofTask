<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Mass</title>
  <desc id="desc">Single cloud silhouette with a subtle animated signal.</desc>
  <style>
    .sig{fill:#22b9e7;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scaleX(.65);opacity:.45}50%{transform:scaleX(1.25);opacity:1}}
    @media(prefers-reduced-motion:reduce){.sig{animation:none}}
  </style>
