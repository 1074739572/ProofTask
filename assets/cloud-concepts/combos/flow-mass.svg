<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Flow Mass</title>
  <desc id="desc">Cloud silhouette with a simple airflow stroke.</desc>
  <style>
    .flow{fill:none;stroke:#22b9e7;stroke-width:10;stroke-linecap:round;stroke-dasharray:80 100;animation:run 2.8s linear infinite}
    @keyframes run{to{stroke-dashoffset:-180}}
    @media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
