<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">云脉 Cloud Stream</title>
  <desc id="desc">Three flowing atmospheric lines forming a compact cloud-agent mark.</desc>
  <style>
    .flow { fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:120 46; animation:flow 3.2s linear infinite; }
    .dot { transform-box:fill-box; transform-origin:center; animation:dot 1.6s ease-in-out infinite; }
    .arrow { transform-box:fill-box; transform-origin:center; animation:arrow 1.8s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset:-166; } }
    @keyframes dot { 0%,100% { transform:scale(.72); opacity:.5; } 50% { transform:scale(1.2); opacity:1; } }
    @keyframes arrow { 0%,100% { transform:translateX(0); } 50% { transform:translateX(5px); } }
    @media (prefers-reduced-motion:reduce) { .flow,.dot,.arrow { animation:none; } }
  </style>
  <path class="flow" d="M33 145 C53 106 85 88 119 92 C153 95 170 118 164 140 C158 162 130 171 108 158 C89 147 89 125 105 113 C119 102 139 107 145 121" fill="none" stroke="#4d6bfe" stroke-width="12"/>
  <path class="flow" d="M40 181 C77 207 126 212 171 194 C197 184 215 168 225 146" fill="none" stroke="#38c6ff" stroke-width="6"/>
  <path class="flow" d="M53 204 C90 225 133 230 174 218" fill="none" stroke="#9cffbe" stroke-width="4" opacity=".85"/>
  <path class="arrow" d="M204 132 L230 132 L220 122 M230 132 L220 142" fill="none" stroke="#ffcc66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot" cx="74" cy="105" r="7" fill="#dff6ff"/>
  <circle class="dot" cx="178" cy="193" r="6" fill="#9cffbe"/>
</svg>
